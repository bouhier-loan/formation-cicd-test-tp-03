name: ci.yml
on: [push, workflow_dispatch]

jobs:
    api-tests:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v6

          - name: Setup Java 21
            uses: actions/setup-java@v5
            with:
              java-version: '21'
              distribution: 'temurin'
              cache: 'maven'

          - name: Build with Maven
            run: mvn clean package

          - name: Run the application
            run: nohup java -jar target/formation-cicd-test-tp-03-1.0-SNAPSHOT.jar > app.log 2>&1 &
            working-directory: ${{ github.workspace }}

          - name: Wait for API to be ready
            run: |
              for i in {1..30}; do
                if curl -sSf http://localhost:8080/health > /dev/null; then
                  echo "API is up!"
                  exit 0
                fi
                echo "Waiting API..."
                sleep 2
              done
              echo "API not ready"
              tail -n 200 ${{ github.workspace }}/app.log || true
              exit 1

          - name: Run API tests (Hurl via Docker)
            run: |
              docker run --rm \
                --add-host=host.docker.internal:host-gateway \
                -v ${{ github.workspace }}:/work \
                ghcr.io/orange-opensource/hurl:latest \
                --test /work/src/test/java/api \
                --report-junit /work/target/hurl-report.xml

          - name: Stop the application
            run: |
              APP_PID=$(lsof -t -i:8080)
              if [ -n "$APP_PID" ]; then
                kill $APP_PID
                echo "Application stopped."
              else
                echo "No application running on port 8080."
              fi

          - name: Archive Hurl test report
            uses: actions/upload-artifact@v6
            with:
              name: hurl-test-report
              path: 'target/hurl-report.xml'

    security-tests:
        needs: api-tests
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v6

          - name: Setup Java 21
            uses: actions/setup-java@v5
            with:
              java-version: '21'
              distribution: 'temurin'
              cache: 'maven'

          - name: Build with Maven
            run: mvn clean package

          - name: Run the application
            run: nohup java -jar target/formation-cicd-test-tp-03-1.0-SNAPSHOT.jar > app.log 2>&1 &
            working-directory: ${{ github.workspace }}

          - name: Wait for API to be ready
            run: |
              for i in {1..30}; do
                if curl -sSf http://localhost:8080/health > /dev/null; then
                  echo "API is up!"
                  exit 0
                fi
                echo "Waiting API..."
                sleep 2
              done
              echo "API not ready"
              tail -n 200 ${{ github.workspace }}/app.log || true
              exit 1
              
          - name: Run security tests with OWASP ZAP
            uses: zaproxy/action-full-scan@v0.8.0
            with:
              target: 'http://host.docker.internal:8080'
              artifact_name: 'zap_scan'
              fail_action: 'true'

          - name: Stop the application
            run: |
              APP_PID=$(lsof -t -i:8080)
              if [ -n "$APP_PID" ]; then
                kill $APP_PID
                echo "Application stopped."
              else
                echo "No application running on port 8080."
              fi

          - name: Archive ZAP scan reports
            uses: actions/upload-artifact@v6
            with:
              name: zap-scan-report
              path: 'report_*.*'